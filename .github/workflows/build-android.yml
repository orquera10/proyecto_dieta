name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: 📝 Aceptar licencias del SDK de Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🚀 Compilar APK con Gradle
        run: |
          cd android
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: ⚠️ Publicar diagnóstico de error
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error
          name: "Build Error Log"
          body: "Log de error de Gradle"
          files: gradle_build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Renombrar APK para descarga fácil
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/DeficitTracker-v1.0.0.apk
          echo "APK generado exitosamente"

      - name: 📤 Subir APK como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DeficitTracker-Android-APK
          path: build-output/DeficitTracker-v1.0.0.apk
          retention-days: 30

      - name: 🏷️ Publicar Release en GitHub con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-apk
          name: "Deficit Tracker v1.0.0 (Android APK)"
          body: "Descarga e instala el archivo APK directamente en tu teléfono Android."
          files: build-output/DeficitTracker-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
