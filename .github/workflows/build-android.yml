name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - 'templates/**'
      - 'static/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Compilar APK de Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 Permisos para Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🚀 Compilar APK con Gradle
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Renombrar APK para descarga fácil
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/DeficitTracker-v1.0.0.apk
          echo "APK generado exitosamente en build-output/DeficitTracker-v1.0.0.apk"

      - name: 📤 Subir APK como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DeficitTracker-Android-APK
          path: build-output/DeficitTracker-v1.0.0.apk
          retention-days: 30
