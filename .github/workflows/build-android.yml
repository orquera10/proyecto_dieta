name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - 'templates/**'
      - 'static/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Compilar APK de Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📝 Aceptar licencias del SDK de Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🔧 Permisos para Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🚀 Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Renombrar APK para descarga fácil
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/DeficitTracker-v1.0.0.apk
          echo "APK generado exitosamente en build-output/DeficitTracker-v1.0.0.apk"

      - name: 📤 Subir APK como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DeficitTracker-Android-APK
          path: build-output/DeficitTracker-v1.0.0.apk
          retention-days: 30

      - name: 🏷️ Publicar Release en GitHub con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-apk
          name: "Deficit Tracker v1.0.0 (Android APK)"
          body: "Descarga e instala el archivo APK directamente en tu teléfono Android."
          files: build-output/DeficitTracker-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
